<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT OVERDRIVE // F1 ECU</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #050505;
            --neon-blue: #00f3ff;
            --neon-red: #ff003c;
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
            --font-main: 'Share Tech Mono', monospace;
            --font-head: 'Orbitron', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            background: var(--bg-color);
            color: #fff;
            font-family: var(--font-main);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- EKRAN STARTOWY (BOOT SCREEN) --- */
        #boot-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            padding: 50px;
            display: flex; flex-direction: column; justify-content: flex-start;
            font-size: 1.2rem;
            color: var(--neon-green);
        }
        .boot-line { margin-bottom: 5px; opacity: 0; animation: typeLine 0.1s forwards; }
        .boot-btn {
            margin-top: 50px; padding: 20px 40px; border: 2px solid var(--neon-green);
            background: transparent; color: var(--neon-green); font-family: var(--font-head);
            font-size: 1.5rem; cursor: pointer; display: none; text-transform: uppercase;
            transition: 0.3s;
        }
        .boot-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 30px var(--neon-green); }

        /* --- GŁÓWNY INTERFEJS --- */
        #main-interface {
            opacity: 0;
            transition: opacity 2s;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            grid-template-rows: 80px 1fr 200px;
            height: 100vh;
            padding: 20px;
            gap: 20px;
            background: radial-gradient(circle at center, #1a1a20 0%, #000 80%);
        }

        /* --- SHIFT LIGHTS (Pasek LED nad kierownicą) --- */
        .shift-lights-container {
            grid-column: 2;
            display: flex; justify-content: center; gap: 5px; align-items: flex-end;
            padding-bottom: 10px;
        }
        .led {
            width: 40px; height: 15px; background: #333; border-radius: 2px;
            box-shadow: inset 0 0 5px #000;
            transition: background 0.05s, box-shadow 0.05s;
        }
        /* Kolory LED */
        .led.active-green { background: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }
        .led.active-red { background: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); }
        .led.active-purple { background: var(--neon-purple); box-shadow: 0 0 20px var(--neon-purple); }

        /* --- CENTRUM (KIEROWNICA) --- */
        .wheel-stage {
            grid-column: 2; grid-row: 2 / 4;
            position: relative; display: flex; justify-content: center; align-items: center;
        }
        .wheel-img {
            width: 90%; max-width: 850px;
            filter: drop-shadow(0 0 50px rgba(0,0,0,0.8));
            transition: transform 0.1s;
        }
        /* Hotspoty */
        .hotspot {
            position: absolute; width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; z-index: 10;
            /* Debug: border: 1px solid red; */ 
        }
        .hotspot:active { transform: scale(0.9); }
        
        /* Pozycje przycisków (Dostosowane do Twojego zdjęcia) */
        .hs-pit { top: 22%; right: 18%; }
        .hs-radio { top: 38%; left: 22%; }
        .hs-fail { top: 38%; right: 22%; }
        .hs-mode { bottom: 20%; right: 28%; } /* Mode Rotary */

        /* --- PANELE BOCZNE --- */
        .panel {
            background: rgba(10, 10, 12, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }
        .panel h3 { color: var(--neon-blue); font-size: 1rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; letter-spacing: 2px; }

        /* RADAR G-FORCE */
        .g-force-radar {
            width: 200px; height: 200px; border: 1px solid #444; border-radius: 50%;
            margin: 20px auto; position: relative;
            background: 
                radial-gradient(circle, transparent 20%, #222 20%, #222 21%, transparent 21%),
                radial-gradient(circle, transparent 60%, #222 60%, #222 61%, transparent 61%),
                linear-gradient(0deg, transparent 49%, #333 49%, #333 51%, transparent 51%),
                linear-gradient(90deg, transparent 49%, #333 49%, #333 51%, transparent 51%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%;
        }
        .g-dot {
            width: 14px; height: 14px; background: var(--neon-red); border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--neon-red);
            transition: top 0.2s, left 0.2s;
        }

        /* LIVE RADIO TRANSCRIPT */
        .radio-box {
            flex: 1; overflow-y: hidden; position: relative;
            font-size: 0.9rem; color: #aaa;
        }
        .msg { margin-bottom: 8px; border-left: 2px solid #555; padding-left: 8px; animation: slideIn 0.3s; }
        .msg.eng { border-color: var(--neon-blue); color: #fff; }
        .msg.driver { border-color: var(--neon-green); color: var(--neon-green); }
        .msg span { font-size: 0.7rem; color: #666; display: block; }

        /* DANE SILNIKA */
        .big-data { font-size: 4rem; font-family: var(--font-head); color: #fff; line-height: 1; text-align: center; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .sub-data { font-size: 1.2rem; color: #666; text-align: center; }
        
        /* ALERT OVERLAY (FAIL MODE) */
        #alert-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, rgba(255,0,0,0.1), rgba(255,0,0,0.1) 10px, transparent 10px, transparent 20px);
            pointer-events: none; display: none; z-index: 50;
            box-shadow: inset 0 0 100px rgba(255,0,0,0.5);
        }
        .fail-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 10rem; color: rgba(255,0,0,0.2); font-family: var(--font-head);
            transform: translate(-50%, -50%) rotate(-10deg);
        }

        @keyframes typeLine { to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div id="boot-layer">
        <div id="boot-text"></div>
        <button id="init-btn" class="boot-btn" onclick="startSystem()">INITIALIZE RACE CONTROL</button>
    </div>

    <div id="alert-overlay"><div class="fail-text">SENSOR FAIL</div></div>

    <div id="main-interface">
        
        <div class="panel">
            <h3>G-FORCE TELEMETRY</h3>
            <div class="g-force-radar">
                <div class="g-dot" id="g-dot"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <span>LATERAL: <b id="g-lat">0.0</b> G</span>
                <span>LONG: <b id="g-long">0.0</b> G</span>
            </div>
        </div>

        <div class="panel" style="grid-row: 2 / 4;">
            <h3>TEAM RADIO <span style="float:right; color:red; animation: blink 1s infinite;">● LIVE</span></h3>
            <div class="radio-box" id="radio-feed">
                </div>
        </div>

        <div class="shift-lights-container" id="shift-bar">
            </div>

        <div class="wheel-stage">
            <img src="./wheel.png" class="wheel-img" id="wheel-obj">
            
            <div class="hotspot hs-pit" onclick="toggleMode('PIT')" title="PIT LIMITER"></div>
            <div class="hotspot hs-radio" onclick="triggerRadio()" title="RADIO"></div>
            <div class="hotspot hs-fail" onclick="toggleMode('FAIL')" title="FAIL SENSOR"></div>
            <div class="hotspot hs-mode" onclick="toggleMode('RACE')" title="RACE MODE"></div>
        </div>

        <div class="panel">
            <h3>POWER UNIT</h3>
            <div class="big-data" id="rpm-disp">0</div>
            <div class="sub-data">RPM</div>
            
            <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div style="text-align: center; border: 1px solid #333; padding: 10px;">
                    <div style="font-size: 2rem; color: var(--neon-blue);" id="gear-disp">N</div>
                    <div style="font-size: 0.8rem; color: #888;">GEAR</div>
                </div>
                <div style="text-align: center; border: 1px solid #333; padding: 10px;">
                    <div style="font-size: 2rem; color: var(--neon-green);" id="speed-disp">0</div>
                    <div style="font-size: 0.8rem; color: #888;">KM/H</div>
                </div>
            </div>
        </div>

        <div class="panel" style="grid-row: 3;">
            <h3>TYRE STATUS</h3>
            <div style="display: flex; gap: 10px; align-items: center; justify-content: center; height: 100%;">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--neon-red);"></i>
                <div>
                    <div style="font-size: 1.5rem;">SOFT C4</div>
                    <div style="color: #888;">TEMP: 102°C <br> WEAR: 78%</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* --- 1. BOOT SEQUENCE --- */
        const bootLines = [
            "BIOS CHECK... OK",
            "LOADING ECU FIRMWARE v24.1...",
            "CONNECTING TO SENSORS (342/342)... OK",
            "HYBRID SYSTEM: CHARGED",
            "ESTABLISHING UPLINK TO PIT WALL...",
            "ENCRYPTING DATA STREAM...",
            "SYSTEM READY."
        ];

        const bootContainer = document.getElementById('boot-text');
        const initBtn = document.getElementById('init-btn');
        let lineIndex = 0;

        function runBoot() {
            if (lineIndex < bootLines.length) {
                const div = document.createElement('div');
                div.className = 'boot-line';
                div.innerText = "> " + bootLines[lineIndex];
                bootContainer.appendChild(div);
                lineIndex++;
                setTimeout(runBoot, 300);
            } else {
                initBtn.style.display = 'block';
            }
        }

        function startSystem() {
            document.getElementById('boot-layer').style.display = 'none';
            document.getElementById('main-interface').style.opacity = '1';
            initAudio.play().catch(e => console.log("Audio needs interaction")); // Optional fake sound logic
            startSimulation();
        }
        
        window.onload = runBoot;

        /* --- 2. SHIFT LIGHTS GENERATOR --- */
        const shiftContainer = document.getElementById('shift-bar');
        // 5 Green, 5 Red, 5 Purple
        for(let i=0; i<15; i++) {
            const led = document.createElement('div');
            led.className = 'led';
            led.id = 'led-'+i;
            shiftContainer.appendChild(led);
        }

        /* --- 3. SYMULACJA DANYCH --- */
        let rpm = 4000;
        let gear = 1;
        let speed = 0;
        let isPitMode = false;
        let isFailMode = false;

        function startSimulation() {
            setInterval(() => {
                // Fizyka jazdy
                if (!isPitMode) {
                    rpm += (Math.random() - 0.4) * 800; // Fluktuacja
                    if (rpm < 3500) rpm = 3500;
                    if (rpm > 13000) rpm = 4000; // Zmiana biegu (uproszczona)
                } else {
                    rpm = 4000 + Math.random() * 200; // Pit limiter
                }

                // Aktualizacja UI
                document.getElementById('rpm-disp').innerText = Math.floor(rpm);
                updateShiftLights(rpm);
                updateGForce();

                // Prędkość i biegi
                if(rpm > 12000) gear = Math.min(gear+1, 8);
                if(rpm < 4000 && gear > 1) gear--;
                
                speed = Math.floor((rpm / 13000) * (gear * 40));
                if(isPitMode) speed = 80;
                
                document.getElementById('speed-disp').innerText = speed;
                document.getElementById('gear-disp').innerText = isPitMode ? 'P' : gear;

            }, 50);
            
            // Radio Loop
            setInterval(() => {
                if(Math.random() > 0.8) triggerRadioRandom();
            }, 5000);
        }

        function updateShiftLights(currentRpm) {
            const maxRpm = 13000;
            const percentage = (currentRpm - 4000) / (maxRpm - 4000);
            const ledsActive = Math.floor(percentage * 15);

            for(let i=0; i<15; i++) {
                const led = document.getElementById('led-'+i);
                led.className = 'led'; // Reset
                if(i < ledsActive) {
                    if(i < 5) led.classList.add('active-green');
                    else if(i < 10) led.classList.add('active-red');
                    else led.classList.add('active-purple');
                }
            }
        }

        function updateGForce() {
            // Symulacja kropki latającej po wykresie
            const dot = document.getElementById('g-dot');
            const lat = (Math.random() - 0.5) * 4; // -2G do 2G
            const long = (Math.random() - 0.5) * 3;
            
            // Mapowanie na piksele (środek to 50%, 50%)
            const x = 50 + (lat * 20); 
            const y = 50 - (long * 20); // Minus bo hamowanie to przód wykresu

            dot.style.left = x + '%';
            dot.style.top = y + '%';
            
            document.getElementById('g-lat').innerText = lat.toFixed(1);
            document.getElementById('g-long').innerText = long.toFixed(1);
        }

        /* --- 4. INTERAKTYWNE FUNKCJE --- */
        const messages = [
            {who: "ENG", text: "Gap to Norris is 1.5 seconds."},
            {who: "DRV", text: "No grip in sector 2!"},
            {who: "ENG", text: "Copy. Change brake balance to +1."},
            {who: "ENG", text: "Box box, box box."},
            {who: "DRV", text: "Tyres are getting cold under VSC."},
            {who: "ENG", text: "Strat 5, Strat 5 available."}
        ];

        function triggerRadioRandom() {
            const msg = messages[Math.floor(Math.random() * messages.length)];
            addRadioLine(msg.who, msg.text);
        }

        function triggerRadio() {
            addRadioLine("DRV", "Radio check. Can you hear me?");
            setTimeout(() => addRadioLine("ENG", "Loud and clear."), 1000);
        }

        function addRadioLine(who, text) {
            const box = document.getElementById('radio-feed');
            const div = document.createElement('div');
            div.className = `msg ${who === 'ENG' ? 'eng' : 'driver'}`;
            div.innerHTML = `<span>${who}</span> ${text}`;
            box.prepend(div);
            if(box.children.length > 6) box.lastChild.remove();
        }

        function toggleMode(mode) {
            const overlay = document.getElementById('alert-overlay');
            if (mode === 'FAIL') {
                isFailMode = !isFailMode;
                overlay.style.display = isFailMode ? 'block' : 'none';
                addRadioLine("SYS", isFailMode ? "SENSOR FAILURE DETECTED" : "SENSORS RESET");
            } else if (mode === 'PIT') {
                isPitMode = !isPitMode;
                addRadioLine("ENG", isPitMode ? "Pit Limiter ON" : "Pit Limiter OFF");
            } else if (mode === 'RACE') {
                isPitMode = false;
                isFailMode = false;
                overlay.style.display = 'none';
                addRadioLine("ENG", "Race Mode Active. Push now.");
            }
        }

    </script>
</body>
</html>
