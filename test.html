<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>75 Pikantnych Pytań - Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --text-color: #e0e0e0;
            --button-gradient: linear-gradient(135deg, #6200ea, #3700b3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Sekcja Generatora */
        .generator-card {
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 50px;
            border: 1px solid #333;
            transition: transform 0.2s;
        }

        .generator-card:hover {
            transform: translateY(-5px);
        }

        #question-display {
            font-size: 1.5rem;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-weight: bold;
            line-height: 1.4;
        }

        button {
            background: var(--button-gradient);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(98, 0, 234, 0.4);
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Sekcja Listy */
        .list-section {
            text-align: left;
            background-color: var(--card-color);
            padding: 30px;
            border-radius: 15px;
        }

        .list-section h2 {
            color: var(--secondary-color);
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        ul {
            list-style-type: none;
        }

        li {
            padding: 10px 0;
            border-bottom: 1px solid #333;
            font-size: 1rem;
            color: #ccc;
        }

        li span.number {
            color: var(--primary-color);
            font-weight: bold;
            margin-right: 10px;
        }

        li:last-child {
            border-bottom: none;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            #question-display { font-size: 1.2rem; }
            .generator-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wymień 3 Rzeczy...</h1>

        <div class="generator-card">
            <div id="question-display">Kliknij przycisk, aby wylosować pytanie!</div>
            <button onclick="drawQuestion()">Wylosuj pytanie</button>
        </div>

        <div class="list-section">
            <h2 onclick="toggleList()" style="cursor: pointer;">Pełna lista pytań (Pokaż/Ukryj)</h2>
            <ul id="full-list" style="display: none;">
                </ul>
        </div>
    </div>

    <script>

            "Wymień 3 rzeczy, które uważasz za nieodparcie atrakcyjne w partnerze",
            "Wymień 3 sposoby, aby sprawić, by Twój partner czuł się pożądany",
            "Wymień 3 kuszące desery do karmienia się nawzajem",
            "Wymień 3 pikantne scenariusze do roli w sypialni",

            "Wymień 3 powody, dla których bycie przyłapanym może być ekscytujące",
            "Wymień 3 zalotne sposoby na rozpoczęcie rozmowy",
            "Wymień 3 uwodzicielskie ruchy do wypróbowania w sypialni",
            "Wymień 3 romantyczne gesty, którymi możesz zaskoczyć swojego partnera",
            "Wymień 3 rzeczy, które sprawiają, że czujesz się pewny siebie",
            "Wymień 3 sposoby na okazanie wdzięczności partnerowi",
            "Wymień 3 rzeczy, które uważasz za sexy w sobie",
            "Wymień 3 aktywności, które urozmaicą leniwe niedzielne popołudnie",
            "Wymień 3 przyjemności, na które sobie pozwalasz"
        ];

        // Funkcja losująca pytanie
        function drawQuestion() {
            const display = document.getElementById('question-display');
            const randomIndex = Math.floor(Math.random() * questions.length);
            
            // Efekt "zanikania" tekstu
            display.style.opacity = 0;
            
            setTimeout(() => {
                display.innerText = questions[randomIndex];
                display.style.opacity = 1;
            }, 200);
        }

        // Funkcja generująca listę (dla sekcji "Pełna lista")
        function populateList() {
            const listContainer = document.getElementById('full-list');
            questions.forEach((q, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="number">${index + 1}.</span> ${q}`;
                listContainer.appendChild(li);
            });
        }

        // Pokaż/Ukryj listę
        function toggleList() {
            const list = document.getElementById('full-list');
            if (list.style.display === "none") {
                list.style.display = "block";
            } else {
                list.style.display = "none";
            }
        }

        // Inicjalizacja listy po załadowaniu
        window.onload = populateList;
    </script>
</body>
</html>
